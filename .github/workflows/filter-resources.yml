name: Refresh filter resources daily
on:
  schedule:
    # 20:00 UTC = 04:00 Asia/Shanghai on the following day.
    - cron: '0 20 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filter-resource-directory
  cancel-in-progress: false
jobs:
  validate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_filter_resources.py
      - name: Update directory without rebuilding Pages
        run: python tools/publish_resource_directory.py
