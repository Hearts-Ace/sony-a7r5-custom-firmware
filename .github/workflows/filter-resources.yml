name: Validate filter resources
on:
  push:
    branches: [main]
    paths: ['filters/**', 'filter-bundles/**', 'resource-info/**', 'tools/validate_filter_resources.py', '.github/workflows/filter-resources.yml']
  pull_request:
    paths: ['filters/**', 'filter-bundles/**', 'resource-info/**', 'tools/validate_filter_resources.py', '.github/workflows/filter-resources.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate_filter_resources.py
