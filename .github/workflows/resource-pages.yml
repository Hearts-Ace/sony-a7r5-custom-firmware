name: Publish resource library
on:
  push:
    branches: [main]
    paths: ['sounds/**', 'docs/resource-library/**', '.github/workflows/resource-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/resource-library/package-lock.json
      - name: Build resource library
        working-directory: docs/resource-library
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/resource-library/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
