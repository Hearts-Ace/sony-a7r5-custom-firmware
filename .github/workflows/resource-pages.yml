name: Publish resource library
on:
  push:
    branches: [main]
    paths: ['sounds/**', 'docs/resource-library/**', '.github/workflows/resource-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble canonical sound resources
        run: |
          mkdir -p docs/resource-library/sounds
          cp sounds/*.R5S sounds/catalog.json docs/resource-library/sounds/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/resource-library
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
